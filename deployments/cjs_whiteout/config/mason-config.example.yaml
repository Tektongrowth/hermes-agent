# CJS Mason production profile template.
# Secrets are loaded into the service environment from AWS SSM at runtime.
# User and role keys below are immutable Discord snowflake IDs, never names.
# Default is deny-all. Alyssa and Nick have admin-read access to the complete
# read-only SynkedUP catalog.

_config_version: 8
model:
  provider: openrouter
  default: google/gemini-3.7-flash
timezone: America/Chicago
group_sessions_per_user: true
memory:
  provider: none
agent:
  disabled_toolsets:
  - terminal
  - browser
  - file
  - code_execution
  - web
  - memory

discord:
  require_mention: true
  allowed_channels: 1539070492424675421,1539071026665885736,1542715089638002789
  auto_thread: true
  thread_require_mention: false
  history_backfill: false
  reactions: true
platform_toolsets:
  discord: []
cjs_permission_profiles:
  none: []
  operations:
  - synkedup-reference-read
  - synkedup-operations-read
  sales:
  - synkedup-reference-read
  - synkedup-sales-read
  financial:
  - synkedup-reference-read
  - synkedup-financial-read
  admin-read: &id001
  - synkedup-reference-read
  - synkedup-operations-read
  - synkedup-sales-read
  - synkedup-financial-read
platform_principal_toolsets:
  discord:
    guilds:
    - '1539070491942453268'
    admin_users:
    - '1412944834372829245'
    - '1541580058152665199'
    default: []
    users:
      '1412944834372829245': &approved-toolsets
      - synkedup-reference-read
      - synkedup-operations-read
      - synkedup-sales-read
      - synkedup-financial-read
      - composio-approved
      - vision
      - cronjob
      - todo
      - skills
      '1541580058152665199': *approved-toolsets
    roles: {}
    user_action_policy:
      irreversible_requires_admin_approval: true
      tool_name_patterns:
      - '(?:^|_)(?:delete|remove|trash|purge|destroy|void|refund|cancel|revoke|terminate|close|disconnect)(?:_|$)'
      - '(?:^|_)(?:send|publish|post|submit|pay|charge|transfer|share|grant|permission|invite|public_link|move)(?:_|$)'
      - '(?:^|_)(?:launch|trigger|execute_workflow|add_contact_to_workflow)(?:_|$)'
mcp_servers:
  cjs-composio:
    command: /home/nick/.hermes/hermes-agent/venv/bin/python
    args:
    - /opt/cjs-whiteout/current/deployments/cjs_whiteout/connectors/cjs_composio_mcp.py
    timeout: 90
    connect_timeout: 20
    supports_parallel_tool_calls: false
    env:
      CJS_COMPOSIO_BIN: /home/nick/.local/bin/composio
      CJS_COMPOSIO_TOOLKITS: googledrive,outlook
      CJS_COMPOSIO_TOOL_PREFIXES: GOOGLEDRIVE,OUTLOOK
      CJS_COMPOSIO_ACCOUNT: REPLACE_WITH_ACTIVE_CJS_GOOGLEDRIVE_ACCOUNT
      CJS_COMPOSIO_ACCOUNT_OUTLOOK: REPLACE_WITH_ACTIVE_CJS_OUTLOOK_ACCOUNT
      CJS_COMPOSIO_ACCOUNT_OUTLOOK_WHITEOUT: REPLACE_WITH_ACTIVE_WHITEOUT_OUTLOOK_ACCOUNT
      CJS_COMPOSIO_CONNECTIONS: '{"cjs-drive":{"toolkit":"googledrive","account":"REPLACE_WITH_ACTIVE_CJS_GOOGLEDRIVE_ACCOUNT","label":"CJS Google Drive"},"cjs-outlook":{"toolkit":"outlook","account":"REPLACE_WITH_ACTIVE_CJS_OUTLOOK_ACCOUNT","label":"CJS Outlook"},"whiteout-outlook":{"toolkit":"outlook","account":"REPLACE_WITH_ACTIVE_WHITEOUT_OUTLOOK_ACCOUNT","label":"Whiteout Outlook"}}'
      CJS_COMPOSIO_AUDIT_PATH: /var/lib/cjs-whiteout/hermes/logs/composio-audit.jsonl
    tools:
      resources: false
      prompts: false
      toolsets:
        composio-approved:
        - composio_connection_status
        - composio_list_connections
        - composio_search
        - composio_tool_schema
        - composio_query_outlook_emails
        - composio_read_outlook_email
        - composio_read_drive_pdf
        - composio_read_drive_text_document
        - composio_read_drive_spreadsheet
        - composio_execute
  cjs-synkedup:
    url: http://127.0.0.1:9342/mcp
    timeout: 360
    connect_timeout: 20
    supports_parallel_tool_calls: false
    tools:
      resources: false
      prompts: false
      toolsets:
        synkedup-reference-read:
        - synkedup_connection_health
        - synkedup_session_status
        - synkedup_company_profile
        - synkedup_employees
        - synkedup_crews
        - synkedup_divisions
        - synkedup_items
        - synkedup_vendors
        synkedup-operations-read:
        - synkedup_jobs
        - synkedup_sold_jobs
        - synkedup_sold_job_materials
        - synkedup_job_briefs
        - synkedup_maintenance
        - synkedup_service_tickets
        - synkedup_schedules
        - synkedup_routes
        - synkedup_work_areas
        - synkedup_job_notes
        - synkedup_job_attachments
        - synkedup_job_photos
        - synkedup_job_documents
        - synkedup_time_entries
        - synkedup_clock_status
        - synkedup_labor_variance
        - synkedup_materials
        - synkedup_equipment
        - synkedup_subcontractors
        - synkedup_item_quantities
        - synkedup_operations_dashboard
        - synkedup_operations_reports
        - synkedup_exports
        synkedup-sales-read:
        - synkedup_customers
        - synkedup_properties
        - synkedup_leads
        - synkedup_consultations
        - synkedup_estimates
        - synkedup_proposals
        - synkedup_sales_pipeline
        - synkedup_pricing_catalog
        synkedup-financial-read:
        - synkedup_job_costing
        - synkedup_margins
        - synkedup_invoices
        - synkedup_balances
        - synkedup_payment_status
        - synkedup_accounting_sync
        - synkedup_financial_dashboard
        - synkedup_financial_reports
